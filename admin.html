<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ShopEasy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h2>ShopEasy Admin</h2>
    <nav>
        <a href="admin.html">Dashboard</a>
        <button onclick="adminLogout()">Logout</button>
    </nav>
</header>

<div class="admin-container">
    <h1>Admin Dashboard</h1>

    <div class="admin-cards">
        <div class="admin-card"><h3>Products</h3><p id="productCount">0</p></div>
        <div class="admin-card"><h3>Customers</h3><p id="customerCount">0</p></div>
        <div class="admin-card"><h3>Orders</h3><p id="orderCount">0</p></div>
    </div>

    <h2>Add Product</h2>
    <form id="productForm">
        <input type="text" id="productName" placeholder="Product Name" required>
        <input type="number" id="productPrice" placeholder="Price" required>
        <input type="text" id="productImage" placeholder="Image URL" required>
        <textarea id="productDescription" placeholder="Product Description" required></textarea>
        <button type="submit">Add Product</button>
    </form>

    <h2>Customers</h2>
    <div id="customers"></div>

    <h2>Orders</h2>
    <div id="adminOrders"></div>
</div>

<script src="script.js"></script>
</body>
</html>
